
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Task List</h1>
        <p>Organize suas tarefas do dia a dia</p>
    </header>

    <main>
        <section class="container">
            <h2>Minhas tarefas</h2>

            <form id="form-tarefa">
                <input type="text" id="nova-tarefa"
                       placeholder="Digite uma nova tarefa"
                       aria-label="Nova tarefa">

                <button type="submit">Adicionar</button>
            </form>

            <ul class="lista-tarefas">
                <li class="tarefa">
                    <span>Estudar para a prova</span>
                    <span class="status pendente">Pendente</span>
                </li>

                <li class="tarefa">
                    <span>Fazer atividade de GitFlow</span>
                    <span class="status concluida">Concluída</span>
                </li>
            </ul>

        </section>
    </main>

    <footer>
        <p>Task List - Projeto GitFlow</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
